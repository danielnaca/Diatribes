<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Diatribes</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <div id="app">

        <div class="chat-col">
            <main id="conversation"></main>
            <footer>
                <div class="input-row" id="input-row">
                    <input type="text" id="text-input" placeholder="Type a message...">
                    <button id="send-btn">Send</button>
                </div>
                <button id="mic-btn" aria-label="Record"></button>
                <button id="skip-btn" hidden>Skip retry</button>
                <div id="status">Tap mic to speak</div>
            </footer>
        </div>

        <aside class="control-col">
            <div class="control-col-inner">

                <div class="header-title">
                    <h1>Diatribes</h1>
                    <div style="display:flex;gap:6px;align-items:center;">
                        <a href="/static/translator.html" id="analyzer-btn">Analyzer →</a>
                        <button id="words-btn">Words (0)</button>
                    </div>
                </div>

                <div class="setting-row">
                    <span class="setting-label">Language</span>
                    <select id="language-select">
                        <option value="French" selected>French</option>
                        <option value="Spanish">Spanish</option>
                        <option value="Italian">Italian</option>
                        <option value="German">German</option>
                        <option value="Portuguese">Portuguese</option>
                        <option value="Japanese">Japanese</option>
                        <option value="Mandarin">Mandarin</option>
                        <option value="Arabic">Arabic</option>
                        <option value="Dutch">Dutch</option>
                        <option value="Russian">Russian</option>
                        <option value="Korean">Korean</option>
                    </select>
                </div>

                <div class="setting-row">
                    <span class="setting-label">Answers</span>
                    <div class="slider-group">
                        <span class="slider-end">Brief</span>
                        <input type="range" id="length-slider" min="1" max="5" value="2" step="1">
                        <span class="slider-end">Long</span>
                    </div>
                </div>

                <div class="setting-row">
                    <span class="setting-label">Corrections</span>
                    <div class="seg" id="corrections-seg">
                        <button class="seg-btn" data-value="off">Off</button>
                        <button class="seg-btn active" data-value="correct">Correct</button>
                        <button class="seg-btn" data-value="repeat">Correct &amp; repeat</button>
                    </div>
                </div>

                <div class="setting-row">
                    <span class="setting-label">Voice</span>
                    <select id="voice-select">
                        <option value="browser">Browser</option>
                        <option value="nova" selected>Nova</option>
                        <option value="alloy">Alloy</option>
                        <option value="echo">Echo</option>
                        <option value="fable">Fable</option>
                        <option value="onyx">Onyx</option>
                        <option value="shimmer">Shimmer</option>
                    </select>
                </div>

                <div class="setting-row">
                    <span class="setting-label">Dialog</span>
                    <div class="seg" id="dialog-seg">
                        <button class="seg-btn" data-value="voice">Voice</button>
                        <button class="seg-btn" data-value="text">Text</button>
                        <button class="seg-btn active" data-value="both">Text &amp; voice</button>
                    </div>
                </div>

                <div class="divider"></div>

                <!-- Approach selector + dynamic controls -->
                <div class="setting-row">
                    <span class="setting-label">Approach</span>
                    <select id="approach-select">
                        <option value="free_mix">Free mix</option>
                        <option value="pos" selected>POS swap</option>
                        <option value="sentence_alt">Alternating</option>
                        <option value="immersion">Immersion</option>
                        <option value="translation">Translations</option>
                    </select>
                </div>

                <p id="approach-desc" class="approach-desc"></p>

                <!-- Free mix controls -->
                <div id="mix-row" class="setting-row">
                    <span class="setting-label">Mix</span>
                    <div class="slider-group">
                        <span class="slider-end">EN</span>
                        <input type="range" id="slider" min="0" max="100" value="30" step="5">
                        <span class="slider-end">FR</span>
                        <span id="slider-value">30%</span>
                    </div>
                </div>

                <!-- POS swap controls -->
                <div id="pos-row" class="setting-row" hidden>
                    <span class="setting-label">Swap</span>
                    <div class="pos-checks" id="pos-checks">
                        <label><input type="checkbox" value="nouns" checked> Nouns</label>
                        <label><input type="checkbox" value="verbs" checked> Verbs</label>
                        <label><input type="checkbox" value="adjectives" checked> Adjs</label>
                        <label><input type="checkbox" value="adverbs" checked> Advs</label>
                    </div>
                </div>

                <div class="divider"></div>

                <div class="meta-grid">
                    <span class="meta-item"><span id="server-time">—</span><span class="meta-label">server</span></span>
                    <span class="meta-item"><span id="frontend-time">—</span><span class="meta-label">frontend</span></span>
                </div>

                <div class="meta-grid" id="timings-row" hidden>
                    <span class="meta-item"><span id="t-whisper">—</span><span class="meta-label">whisper</span></span>
                    <span class="meta-item"><span id="t-claude">—</span><span class="meta-label">claude</span></span>
                    <span class="meta-item"><span id="t-rewrite">—</span><span class="meta-label">rewrite</span></span>
                    <span class="meta-item"><span id="t-tts">—</span><span class="meta-label">tts</span></span>
                    <span class="meta-item"><span id="t-total">—</span><span class="meta-label">total</span></span>
                </div>

            </div>
        </aside>

    </div>

    <div id="words-panel" hidden>
        <div class="panel-header">
            <h2>Trouble Words</h2>
            <button id="close-panel">&times;</button>
        </div>
        <ul id="words-list"></ul>
    </div>

    <script src="/static/dict-swap.js"></script>
    <script src="/static/app.js"></script>
</body>
</html>
