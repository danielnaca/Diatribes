<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Diatribes — Book Summarizer</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        [hidden] { display: none !important; }

        :root {
            --bg:         #111;
            --surface:    #1a1a1a;
            --surface2:   #222;
            --border:     #2a2a2a;
            --primary:    #e94560;
            --text:       #eee;
            --text-dim:   #999;
            --text-faint: #555;
        }

        html, body {
            height: 100%;
            font-family: -apple-system, BlinkMacSystemFont, 'SF Pro', system-ui, sans-serif;
            background: var(--bg);
            color: var(--text);
            font-size: 15px;
            line-height: 1.5;
        }

        #page {
            display: flex;
            flex-direction: column;
            min-height: 100%;
            max-width: 820px;
            margin: 0 auto;
            padding-bottom: 64px;
        }

        nav {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 12px 16px;
            border-bottom: 1px solid var(--border);
            background: var(--surface);
            position: sticky;
            top: 0;
            z-index: 5;
        }

        nav h1 {
            font-size: 16px;
            font-weight: 600;
        }

        .nav-back {
            color: var(--text-dim);
            text-decoration: none;
            font-size: 14px;
        }

        .nav-back:hover { color: var(--text); }
        .nav-spacer { width: 60px; }

        main {
            padding: 20px 16px;
        }

        .upload-card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 20px;
            text-align: center;
        }

        .upload-card p {
            color: var(--text-dim);
            margin-bottom: 14px;
            font-size: 14px;
        }

        button.primary {
            background: var(--primary);
            color: #fff;
            border: 0;
            padding: 10px 18px;
            border-radius: 6px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
        }

        button.primary:hover { filter: brightness(1.1); }
        button.primary:disabled { opacity: 0.5; cursor: not-allowed; }

        button.ghost {
            background: transparent;
            color: var(--text-dim);
            border: 1px solid var(--border);
            padding: 6px 12px;
            border-radius: 4px;
            font-size: 13px;
            cursor: pointer;
        }

        button.ghost:hover { color: var(--text); border-color: var(--text-dim); }

        #file-input { display: none; }

        #status {
            margin-top: 16px;
            color: var(--text-dim);
            font-size: 13px;
            min-height: 18px;
        }

        #chapters {
            list-style: none;
            margin-top: 24px;
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        .chapter {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 16px 18px;
        }

        .chapter h2 {
            font-size: 15px;
            font-weight: 600;
            margin-bottom: 10px;
            color: var(--text);
        }

        .chapter .summary {
            color: var(--text);
            font-size: 14px;
            line-height: 1.6;
            white-space: pre-wrap;
        }

        .chapter .summary.placeholder {
            color: var(--text-faint);
            font-style: italic;
        }

        .chapter .summary.error {
            color: #ff8a8a;
        }

        .chapter .actions {
            margin-top: 8px;
        }
    </style>
</head>
<body>
<div id="page">
    <nav>
        <a href="/" class="nav-back">← Back</a>
        <h1>Book Summarizer</h1>
        <div class="nav-spacer"></div>
    </nav>

    <main>
        <div class="upload-card">
            <p>Upload a <code>.txt</code> file of your book. We'll split it into chapters and summarize each one.</p>
            <input type="file" id="file-input" accept=".txt,text/plain">
            <button class="primary" id="upload-btn">Upload book</button>
            <div id="status"></div>
        </div>

        <ol id="chapters"></ol>
    </main>
</div>

<script src="/static/book.js"></script>
</body>
</html>
